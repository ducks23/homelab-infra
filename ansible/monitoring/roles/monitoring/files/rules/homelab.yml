# Managed by Ansible (ansible/monitoring/roles/monitoring). Uptime of hosts, services and websites.
groups:
  - name: pipeline
    rules:
      # Always firing. Alertmanager forwards it to Healthchecks.io every minute; if that stops,
      # Healthchecks.io emails you (the Proxmox host, this VM or Alertmanager is down).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Alerting pipeline heartbeat

      - alert: ScrapeTargetDown
        expr: up{job!~"ping|tcp|http"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: Prometheus can't scrape it. For job=proxmox this usually means the Proxmox API is unreachable or the token is wrong.

      - alert: AlertEmailFailing
        expr: rate(alertmanager_notifications_failed_total{integration="email"}[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager can't send email
          description: Check `docker logs alertmanager` on the monitoring VM; the Gmail app password may have been revoked.

  - name: uptime
    rules:
      - alert: HostUnreachable
        expr: probe_success{job="ping"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} doesn't answer ping"

      - alert: ServiceDown
        expr: probe_success{job="tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.host }}) isn't accepting connections"

      - alert: WebsiteDown
        expr: probe_success{job="http"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: No 2xx response over valid HTTPS. Check the app's pods and the dev cluster's Traefik.

      - alert: TLSCertificateExpiring
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}'s certificate expires in {{ $value | humanize }} days"
          description: cert-manager should have renewed it by now; check its logs and the Cloudflare token.
