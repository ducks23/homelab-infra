---
# Secrets, read from 1Password (homelab vault) when the playbook runs.
# Sign in first: the 1Password desktop app's CLI integration, or `eval $(op signin)`.
monitoring_smtp_password: "{{ lookup('community.general.onepassword', 'alertmanager-smtp', field='password', vault='homelab') }}"
monitoring_grafana_admin_password: "{{ lookup('community.general.onepassword', 'grafana', field='admin-password', vault='homelab') }}"
monitoring_pve_token_secret: "{{ lookup('community.general.onepassword', 'proxmox-monitoring', field='token-secret', vault='homelab') }}"

# Optional. Healthchecks.io ping URL for the dead man's switch; while the item doesn't exist,
# the Watchdog alert goes nowhere.
monitoring_healthchecks_url: "{{ lookup('community.general.onepassword', 'healthchecks', field='watchdog-url', vault='homelab', errors='ignore') | default('', true) }}"
