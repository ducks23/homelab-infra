---
# Alpine 3.24 only ships versioned packages (postgresql16/17/18), no unversioned meta package.
postgresql_version: "18"

# Alpine's init script keeps config here and the cluster under /var/lib/postgresql/<version>/data.
postgresql_conf_dir: /etc/postgresql
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/data"

# Where PostgreSQL listens. "*" = all interfaces; access is still gated by pg_hba below.
postgresql_listen_addresses: "*"

# Tuned for the 2 GB VM in terraform/alpine-postgres.tf; scale up with the VM.
postgresql_max_connections: 100
postgresql_shared_buffers: 512MB        # ~25% of RAM
postgresql_effective_cache_size: 1GB    # ~50% of RAM
postgresql_work_mem: 4MB
postgresql_maintenance_work_mem: 128MB

# Any other postgresql.conf settings, written verbatim to conf.d/10-ansible.conf, e.g.
#   postgresql_conf_extra: { log_min_duration_statement: 500, wal_level: replica }
postgresql_conf_extra: {}

# Extra pg_hba.conf rules, added after the built-in local/loopback ones. address is required;
# type defaults to host, database/user to all, method to scram-sha-256. Example:
#   - { type: host, database: app, user: app, address: 192.168.1.0/24 }
postgresql_hba_entries: []

# Roles:  - { name: app, password: "{{ vault_app_password }}", role_attr_flags: "CREATEDB" }
postgresql_users: []

# Databases:  - { name: app, owner: app }
postgresql_databases: []
