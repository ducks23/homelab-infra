apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patchwork
resources:
  - ../../base/patchwork
  - env-secret.yaml
patches:
  - target:
      kind: Ingress
      name: patchwork
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: patchwork.dev.naboo.party
images:
  - name: ghcr.io/ducks23/patchwork-planner
    newTag: "20261029191103" # {"$imagepolicy": "flux-system:patchwork-dev:tag"}
