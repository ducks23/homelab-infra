# The app's settings, with the passwords from 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patchwork-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DATABASE_URL: "postgres://patchwork:{{ .dbPassword }}@192.168.1.30:5432/patchwork"
        SECRET_KEY: "{{ .secretKey }}"
        APP_PASSWORD: "{{ .appPassword }}"
        DEBUG: "false"
        ALLOWED_HOSTS: patchwork.dev.naboo.party
        CSRF_TRUSTED_ORIGINS: https://patchwork.dev.naboo.party
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-patchwork/password
    - secretKey: secretKey
      remoteRef:
        key: patchwork/secret-key
    - secretKey: appPassword
      remoteRef:
        key: patchwork/password
