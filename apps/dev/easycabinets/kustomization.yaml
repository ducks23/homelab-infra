apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: easycabinets
resources:
  - ../../base/easycabinets
  - env-secret.yaml
patches:
  - target:
      kind: Ingress
      name: easycabinets
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: easycabinets.dev.naboo.party
images:
  - name: ghcr.io/ducks23/easycabinets
    newTag: "20261029212318" # {"$imagepolicy": "flux-system:easycabinets-dev:tag"}
