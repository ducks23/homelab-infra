# The app's settings, with the passwords and the admin list from 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: easycabinets-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DATABASE_URL: "postgresql+psycopg://easycabinets:{{ .dbPassword }}@192.168.1.30:5432/easycabinets"
        PUBLIC_URL: https://easycabinets.dev.naboo.party
        ALLOW_SIGNUP: "true"
        GOOGLE_CLIENT_ID: "{{ .googleClientId }}"
        GOOGLE_CLIENT_SECRET: "{{ .googleClientSecret }}"
        ADMIN_EMAILS: "{{ .adminEmails }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-easycabinets/password
    - secretKey: googleClientId
      remoteRef:
        key: easycabinets-google/client-id
    - secretKey: googleClientSecret
      remoteRef:
        key: easycabinets-google/client-secret
    - secretKey: adminEmails
      remoteRef:
        key: easycabinets/admin-emails
