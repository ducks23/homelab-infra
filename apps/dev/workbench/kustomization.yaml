apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workbench
resources:
  - ../../base/workbench
  - env-secret.yaml
patches:
  - target:
      kind: Ingress
      name: workbench
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: workbench.dev.naboo.party
images:
  - name: ghcr.io/ducks23/workbench
    newTag: "20261014203814" # {"$imagepolicy": "flux-system:workbench-dev:tag"}
