# The app's settings, with the passwords from 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workbench-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DATABASE_URL: "postgres://workbench:{{ .dbPassword }}@192.168.1.30:5432/workbench"
        APP_PASSWORD: "{{ .appPassword }}"
        SESSION_SECRET: "{{ .sessionSecret }}"
        # Where "Read" links send you: the Bible app (bible-api repo, web/).
        BIBLE_READER_URL: https://bible.dev.naboo.party
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-workbench/password
    - secretKey: appPassword
      remoteRef:
        key: workbench/password
    - secretKey: sessionSecret
      remoteRef:
        key: workbench/session-secret
