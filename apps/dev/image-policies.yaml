# Dev runs the newest build of everything. Each app's CI tags every push to main
# with its UTC build time (YYYYMMDDHHMMSS), so the biggest number wins.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: easycabinets-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: easycabinets
  filterTags:
    pattern: '^\d{14}$'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: workbench-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: workbench
  filterTags:
    pattern: '^\d{14}$'
  policy:
    numerical:
      order: asc
