apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bible
resources:
  - ../../base/bible-app
patches:
  - target:
      kind: Ingress
      name: bible-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: bible-app.dev.naboo.party
images:
  - name: ghcr.io/ducks23/bible-app
    newTag: "20261101050436" # {"$imagepolicy": "flux-system:bible-app-dev:tag"}
