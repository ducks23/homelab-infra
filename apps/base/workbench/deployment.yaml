apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
spec:
  # Stateless: everything lives in PostgreSQL. Two pods so a node restart doesn't take it down.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # a new pod is ready before an old one goes
      maxSurge: 1
  selector:
    matchLabels:
      app: workbench
  template:
    metadata:
      labels:
        app: workbench
    spec:
      imagePullSecrets:
        # From 1Password, see ghcr-pull.yaml.
        - name: ghcr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workbench
      # preStop sleep + grace: Traefik drops a terminating pod from its endpoints a moment
      # after Kubernetes marks it, so keep serving for a few seconds instead of 502ing.
      terminationGracePeriodSeconds: 30
      containers:
        - name: workbench
          # The tag is set in apps/dev/workbench, and Flux bumps it there.
          image: ghcr.io/ducks23/workbench
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            # DATABASE_URL, APP_PASSWORD, SESSION_SECRET, BIBLE_READER_URL: from 1Password, see
            # apps/dev/workbench/env-secret.yaml.
            - secretRef:
                name: workbench-env
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            # TCP only: /api/health checks the database, and a database outage shouldn't restart the pods.
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
