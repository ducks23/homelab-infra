# EasyCabinets (github.com/ducks23/easycabinets). Its CI pushes images; the tag
# and per-cluster settings are in ../../<env>/easycabinets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: easycabinets
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ghcr-pull.yaml
