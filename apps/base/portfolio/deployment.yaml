apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  # Stateless: no database or settings. Two pods so a node restart doesn't take it down.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # a new pod is ready before an old one goes
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      imagePullSecrets:
        # From 1Password, see ghcr-pull.yaml.
        - name: ghcr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: portfolio
      # preStop sleep + grace: Traefik drops a terminating pod from its endpoints a moment
      # after Kubernetes marks it, so keep serving for a few seconds instead of 502ing.
      terminationGracePeriodSeconds: 30
      containers:
        - name: portfolio
          # The tag is set in apps/dev/portfolio, and Flux bumps it there.
          image: ghcr.io/ducks23/portfolio
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
