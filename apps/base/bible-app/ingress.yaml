# Traefik routes on the Host header; each overlay sets the real host. TLS comes
# from Traefik's default TLSStore (the cluster's wildcard certificate).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bible-app
spec:
  ingressClassName: traefik
  rules:
    - host: bible-app.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bible-app
                port:
                  number: 80
