# Patchwork Planner (github.com/ducks23/patchwork-planner). Its CI pushes images; the tag
# and per-cluster settings are in ../../<env>/patchwork.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patchwork
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ghcr-pull.yaml
