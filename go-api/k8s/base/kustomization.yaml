# Everything both clusters share. Per-cluster differences (replicas, ingress
# host) live in ../overlays/dev and ../overlays/prod. Preview a result with
# `make k8s-render OVERLAY=prod`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-api
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
