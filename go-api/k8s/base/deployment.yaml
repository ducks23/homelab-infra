apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      imagePullSecrets:
        # Created by `make deploy` from the GitHub token; never committed.
        - name: ghcr-pull
      containers:
        - name: go-api
          # The tag is set at deploy time by `make` (a unique timestamp), so
          # IfNotPresent still pulls every new release.
          image: ghcr.io/ducks23/go-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            # Created from .env / .env.prod by `make deploy`; never committed.
            - secretRef:
                name: go-api-env
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            # TCP only: /health depends on the database, and a DB outage
            # shouldn't restart the pods.
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
