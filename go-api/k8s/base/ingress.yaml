# Traefik routes on the Host header. The host here is a placeholder; each
# overlay sets the real one (<app>.<cluster>.naboo.party, covered by the
# cluster's wildcard DNS record and wildcard cert from k8s/tls).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api
  annotations:
    # Serve over HTTPS with Traefik's default (wildcard) certificate.
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: go-api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 80
