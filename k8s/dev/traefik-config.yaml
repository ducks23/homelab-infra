# Overrides for the Traefik Helm chart that k3s bundles.
# - Redirect all HTTP to HTTPS.
# - Route the dashboard on the internal "traefik" entrypoint (:8080) only; it
#   isn't exposed through the LoadBalancer. Reach it with:
#     kubectl -n kube-system port-forward deploy/traefik 9000:8080
#     open http://localhost:9000/dashboard/
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    ingressRoute:
      dashboard:
        enabled: true
