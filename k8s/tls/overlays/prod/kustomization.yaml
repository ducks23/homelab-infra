apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Certificate
      name: wildcard
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value: ["*.prod.naboo.party"]
# Cloudflare API token (Zone > DNS > Edit on naboo.party only), read from the
# gitignored .env.cloudflare next to this file. Copy .env.cloudflare.example.
secretGenerator:
  - name: cloudflare-api-token
    namespace: cert-manager
    envs:
      - .env.cloudflare
    options:
      disableNameSuffixHash: true
