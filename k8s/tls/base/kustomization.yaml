# Trusted HTTPS for everything behind Traefik. Shared by both clusters; each
# overlay sets its wildcard domain and supplies its Cloudflare token.
# Requires cert-manager to be installed first (see ../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuers.yaml
  - certificate.yaml
  - tlsstore.yaml
  - traefik-config.yaml
