# Where every ExternalSecret in the cluster reads from: the 1Password "homelab"
# vault, through a read-only 1Password service account. A remoteRef key is
# "<item>/<field>", the same names as the op:// references in the repo.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token
          key: token
          namespace: external-secrets
