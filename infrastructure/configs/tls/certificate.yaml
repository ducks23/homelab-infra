# One wildcard cert per cluster, *.dev.naboo.party or *.prod.naboo.party. It lives in
# kube-system because Traefik (k3s's bundled one) runs there and the TLSStore
# can only reference secrets in its own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.${cluster}.naboo.party"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
