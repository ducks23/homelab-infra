# Copies secrets out of the 1Password "homelab" vault into Kubernetes Secrets, so
# nothing secret is ever committed. The store it reads from is in ../configs.
# Its one credential, the 1Password service account token, is put in the
# cluster by scripts/flux-bootstrap.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
