# Two independent k3s clusters (prod, dev). Addresses match proxmox/k3s-clusters.tf.
#
# Topology per cluster: all 3 nodes run as k3s "server" nodes with embedded
# etcd (HA). node1 is the cluster-init node; node2/node3 join it. Each cluster
# has its own kube-vip VIP and join token (see group_vars/prod/, dev/).
#
# Group layout:
#   <cluster>_server / <cluster>_agent  -> role of the host within that cluster
#   <cluster>                           -> everything in that cluster
#   k3s_server / k3s_agent / k3s_cluster -> the union across both clusters
#
# Target one cluster with:  ansible-playbook site.yml --limit prod

# --- prod: VIP 192.168.1.10 -------------------------------------------------
[prod_server]
prod-node1 ansible_host=192.168.1.11
prod-node2 ansible_host=192.168.1.12
prod-node3 ansible_host=192.168.1.13

# Optional pure worker nodes for prod
[prod_agent]

[prod:children]
prod_server
prod_agent

# --- dev: VIP 192.168.1.20 --------------------------------------------------
[dev_server]
dev-node1 ansible_host=192.168.1.21
dev-node2 ansible_host=192.168.1.22
dev-node3 ansible_host=192.168.1.23

# Optional pure worker nodes for dev
[dev_agent]

[dev:children]
dev_server
dev_agent

# --- Unions used by site.yml ------------------------------------------------
[k3s_server:children]
prod_server
dev_server

[k3s_agent:children]
prod_agent
dev_agent

[k3s_cluster:children]
prod
dev

[all:vars]
ansible_user=ubuntu
# Uncomment and point at your SSH private key if it isn't the default id_rsa/id_ed25519
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
