---
# Secrets for the dev cluster, read from 1Password (homelab vault) when the playbook runs.
# Sign in first: the 1Password desktop app's CLI integration, or `eval $(op signin)`.
# A vault.yml next to this file still wins (it loads later); delete it once the value is in 1Password.
vault_k3s_token: "{{ lookup('community.general.onepassword', 'k3s-dev', field='token', vault='homelab') }}"
