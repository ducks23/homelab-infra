---
# Server settings you're likely to change. Every option and its default is in
# roles/minecraft/defaults/main.yml. Re-run `ansible-playbook site.yml` after editing.

# Game version. Players need the same version to join. Change it here to upgrade.
minecraft_version: "26.2"

minecraft_motd: "naboo.party"
minecraft_difficulty: normal

# Minecraft usernames allowed to join. While this is empty anyone on the network can
# join; once you add names, only they can.
minecraft_whitelist: []

# Usernames with operator (admin) permissions in game.
minecraft_ops: []
