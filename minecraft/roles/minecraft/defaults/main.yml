---
# Runs the itzg/minecraft-server image (https://docker-minecraft-server.readthedocs.io).
# Pin a tag (e.g. "2026.9.0-java21") to control when the image itself updates.
minecraft_image: "itzg/minecraft-server:latest"

# PAPER is a faster drop-in replacement for the vanilla server that also supports plugins.
# Use VANILLA for the official server.
minecraft_type: PAPER
# "LATEST" or a specific game version such as "1.21.8". Clients must match it.
minecraft_version: LATEST

# Java heap. Leave ~2 GB of the VM's RAM for the OS and JVM overhead.
minecraft_memory: 6G

minecraft_port: 25565
minecraft_motd: "A Minecraft Server"
minecraft_difficulty: normal
minecraft_max_players: 10
minecraft_view_distance: 10
minecraft_whitelist: []
minecraft_ops: []

# Where the compose file and world data live on the VM.
minecraft_dir: /srv/minecraft
