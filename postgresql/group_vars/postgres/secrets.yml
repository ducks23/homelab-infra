---
# Database role passwords, read from 1Password (homelab vault) when the playbook runs.
# Sign in first: the 1Password desktop app's CLI integration, or `eval $(op signin)`.
# A vault.yml next to this file still wins (it loads later); delete it once the values are in 1Password.
vault_postgresql_app_password: "{{ lookup('community.general.onepassword', 'postgres-app', field='password', vault='homelab') }}"
vault_postgresql_app_prod_password: "{{ lookup('community.general.onepassword', 'postgres-app-prod', field='password', vault='homelab') }}"
vault_postgresql_easycabinets_password: "{{ lookup('community.general.onepassword', 'postgres-easycabinets', field='password', vault='homelab') }}"
vault_postgresql_workbench_password: "{{ lookup('community.general.onepassword', 'postgres-workbench', field='password', vault='homelab') }}"
vault_postgresql_patchwork_password: "{{ lookup('community.general.onepassword', 'postgres-patchwork', field='password', vault='homelab') }}"
