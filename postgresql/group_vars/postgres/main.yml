---
# Overrides for the alpine-postgres host. Every option and its default is documented in
# roles/postgresql/defaults/main.yml.

# DNS servers written to /etc/resolv.conf on first bootstrap (keep in sync with
# var.dns_servers in proxmox/variables.tf).
alpine_dns_servers:
  - 192.168.1.1

# Accept connections from the LAN (password auth, scram-sha-256). Each role may
# only reach its own database.
postgresql_hba_entries:
  - { type: host, database: easycabinets, user: easycabinets, address: 192.168.1.0/24 }
  - { type: host, database: workbench, user: workbench, address: 192.168.1.0/24 }

# Roles and databases to create (easycabinets = the EasyCabinets app, workbench = the Workbench planner). Passwords come from 1Password, see secrets.yml.
postgresql_users:
  - name: easycabinets
    password: "{{ vault_postgresql_easycabinets_password }}"
  - name: workbench
    password: "{{ vault_postgresql_workbench_password }}"

postgresql_databases:
  - name: easycabinets  # EasyCabinets (~/Documents/easycabinets), used by the dev k3s cluster
    owner: easycabinets
  - name: workbench  # Workbench planner (~/Documents/workbench), used by the dev k3s cluster
    owner: workbench
