# Address matches proxmox/alpine-postgres.tf.
[postgres]
alpine-postgres ansible_host=192.168.1.30

[all:vars]
# Alpine's cloud image creates "alpine" (not "ubuntu") and grants it passwordless doas.
ansible_user=alpine
ansible_become_method=doas
# The postgres tasks become the unprivileged "postgres" user from an unprivileged login user;
# pipelining avoids Ansible having to leave temp files that user could read.
ansible_pipelining=true
ansible_python_interpreter=/usr/bin/python3
# Uncomment and point at your SSH private key if it isn't the default id_rsa/id_ed25519
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
