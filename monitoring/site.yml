---
- name: Provision the monitoring stack
  hosts: monitoring
  become: true
  pre_tasks:
    - name: Wait for SSH (cloud-init is still applying the key on first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish (it holds the apt lock on first boot)
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      # 2 = finished with recoverable warnings, which is fine here.
      failed_when: cloud_init.rc not in [0, 2]
      changed_when: false
  roles:
    - monitoring
