---
# What gets watched and where alerts go. Every option and its default is in
# roles/monitoring/defaults/main.yml. Re-run `ansible-playbook site.yml` after editing.

monitoring_alert_email: jesse1517@gmail.com

# Proxmox host, read through its API by pve-exporter (token in 1Password, see ../README.md).
monitoring_pve_host: 192.168.1.146

# node_exporter on the Proxmox host and VMs (installed by node-exporter.yml). The k3s nodes
# send theirs through Alloy (../k8s/monitoring) instead.
monitoring_node_targets:
  - { host: pve, address: "192.168.1.146:9100", env: prod }
  - { host: alpine-postgres, address: "192.168.1.30:9100", env: prod }
  - { host: minecraft, address: "192.168.1.40:9100", env: prod }
  - { host: devbox, address: "192.168.1.50:9100", env: dev }

# Every probe target gets a `host` label (alerts about a host's services are muted while the
# host itself is unreachable) and an `env` label (env=dev alerts repeat once a day, not every 4h).

# Hosts that should answer ping.
monitoring_ping_targets:
  - { host: pve, address: 192.168.1.146, env: prod }
  - { host: truenas, address: 192.168.1.218, env: prod }
  - { host: prod-node1, address: 192.168.1.11, env: prod }
  - { host: prod-node2, address: 192.168.1.12, env: prod }
  - { host: prod-node3, address: 192.168.1.13, env: prod }
  - { host: dev-node1, address: 192.168.1.21, env: dev }
  - { host: dev-node2, address: 192.168.1.22, env: dev }
  - { host: dev-node3, address: 192.168.1.23, env: dev }
  - { host: alpine-postgres, address: 192.168.1.30, env: prod }
  - { host: minecraft, address: 192.168.1.40, env: prod }
  - { host: devbox, address: 192.168.1.50, env: dev }

# Services that should accept a TCP connection.
monitoring_tcp_targets:
  - { name: proxmox-ui, host: pve, address: "192.168.1.146:8006", env: prod }
  - { name: truenas-nfs, host: truenas, address: "192.168.1.218:2049", env: prod }
  - { name: k3s-prod-api, host: prod-vip, address: "192.168.1.10:6443", env: prod }
  - { name: k3s-dev-api, host: dev-vip, address: "192.168.1.20:6443", env: dev }
  - { name: postgresql, host: alpine-postgres, address: "192.168.1.30:5432", env: prod }
  - { name: minecraft, host: minecraft, address: "192.168.1.40:25565", env: prod }

# Websites that should return 2xx over valid HTTPS. Certificate expiry is checked too.
monitoring_http_targets:
  - { name: easycabinets, host: dev-vip, url: "https://easycabinets.dev.naboo.party", env: dev }
  - { name: workbench, host: dev-vip, url: "https://workbench.dev.naboo.party", env: dev }
