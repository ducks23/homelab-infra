# Addresses match ../proxmox/*.tf.
[monitoring]
monitoring ansible_host=192.168.1.60

# Hosts that get node_exporter (node-exporter.yml).
[node_exporter]
pve ansible_host=192.168.1.146 ansible_user=root node_exporter_extra_packages='["prometheus-node-exporter-collectors"]' node_exporter_apt_update=false
devbox ansible_host=192.168.1.50
# Alpine's cloud image creates "alpine" (not "ubuntu") and grants it passwordless doas.
alpine-postgres ansible_host=192.168.1.30 ansible_user=alpine ansible_become_method=doas

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
# Uncomment and point at your SSH private key if it isn't the default id_rsa/id_ed25519
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
