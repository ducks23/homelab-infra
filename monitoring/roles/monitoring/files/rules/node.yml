# Managed by Ansible (monitoring/roles/monitoring). Linux hosts (node_exporter): the Proxmox
# host and VMs (job="node", labelled host) and the k3s nodes (via Alloy, labelled cluster).
groups:
  - name: node
    rules:
      - alert: HostDiskFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.lxcfs"}
            / node_filesystem_size_bytes < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.lxcfs"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }}: {{ $labels.mountpoint }} will be full within a day at the current rate"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }} has {{ $value | humanizePercentage }} memory available"

      - alert: HostHighCpu
        expr: |
          1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }} CPU has been {{ $value | humanizePercentage }} busy for 30 minutes"

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }}: the kernel killed a process for running out of memory"

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ or $labels.host $labels.instance }}: systemd unit {{ $labels.name }} has failed"
